<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#10141b"><title>Цып-Цып 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f15;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;touch-action:none}canvas{display:block;width:100%;height:100%;background:#101722}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px;padding:max(12px,env(safe-area-inset-top)) 12px 0}.pill{background:#111a28cc;border:1px solid #ffffff22;border-radius:14px;padding:7px 10px;backdrop-filter:blur(8px);font-weight:800;font-size:13px}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#08101acc,#05070dcc);z-index:5}.card{width:min(92vw,430px);padding:26px 20px 22px;border-radius:28px;background:linear-gradient(180deg,#172236f2,#0b111bf2);border:1px solid #ffffff20;box-shadow:0 25px 80px #000b;text-align:center}.logo{font-size:46px;font-weight:950;letter-spacing:-2px}.sub{opacity:.75;margin:5px 0 20px}.btn{border:0;border-radius:18px;padding:15px 20px;font-size:19px;font-weight:900;color:#081018;background:#ffd33d;box-shadow:0 8px 0 #b88300;min-width:190px}.btn:active{transform:translateY(5px);box-shadow:0 3px 0 #b88300}.small{font-size:12px;opacity:.6;margin-top:16px}.controls{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 16px;pointer-events:auto}.ctrl{width:31vw;max-width:145px;height:68px;border-radius:22px;border:1px solid #ffffff25;background:#111a28cc;color:#fff;font-size:17px;font-weight:950;backdrop-filter:blur(8px);box-shadow:0 8px 25px #0006}.ctrl:active{transform:scale(.96)}.hint{font-size:13px;opacity:.7;margin:10px}.hide{display:none}.bar{height:7px;background:#ffffff18;border-radius:8px;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;width:0;background:#ffd33d}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.stat{background:#ffffff0b;border-radius:14px;padding:10px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;opacity:.6}
</style></head><body><canvas id="game"></canvas><div class="hud"><div class="top"><div class="pill">🐥 ЦЫП-ЦЫП 3D</div><div class="pill">⭐ <span id="score">0</span></div><div class="pill">🏆 <span id="best">0</span></div></div></div><div id="menu" class="screen"><div class="card"><div class="logo">🐥 Цып-Цып</div><div class="sub">3D ROAD RUNNER</div><p>Прыгай через машины<br>и пригибайся под светофорами.</p><button id="start" class="btn">НАЧАТЬ БЕГ</button><div class="small">🎵 Музыка включается кнопкой старта</div></div></div><div id="over" class="screen hide"><div class="card"><div class="logo">💥 Ой!</div><div class="sub">Цып-Цып остановился</div><div class="stats"><div class="stat"><b id="finalScore">0</b><span>ОЧКОВ</span></div><div class="stat"><b id="finalDist">0 м</b><span>ДИСТАНЦИЯ</span></div></div><div class="bar"><i id="bar"></i></div><button id="again" class="btn">ЕЩЁ РАЗ</button></div></div><div id="controls" class="controls hide"><button id="duck" class="ctrl">↘ ПРИГНУТЬСЯ</button><button id="jump" class="ctrl">⬆ ПРЫЖОК</button></div><audio id="music" src="cypa_song.mp3" preload="auto" loop></audio><script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,dpr,run=false,dead=false,t=0,last=0,score=0,dist=0,speed=7,best=+localStorage.cypBest3d||0,duck=false,jump=0,spawn=0,items=[];document.getElementById('best').textContent=best;
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function rnd(a,b){return a+Math.random()*(b-a)}
function roadY(z){return H*.46+Math.pow(z,1.65)*H*.58}function roadW(z){return W*(.16+.72*Math.pow(z,1.35))}
function project(lane,z){return W/2+lane*roadW(z)*.32}
function poly(points,fill){x.beginPath();points.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fillStyle=fill;x.fill()}
function drawWorld(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#79b8d8');g.addColorStop(.48,'#d8e4cf');g.addColorStop(.49,'#496b43');g.addColorStop(1,'#18281a');x.fillStyle=g;x.fill();
 // distant city/hills
 for(let i=0;i<12;i++){let bx=i*W/10-40, bh=35+(i%4)*22;x.fillStyle=i%2?'#78909c':'#667b87';x.fillRect(bx,H*.42-bh,55,bh)}
 // road
 poly([[W/2-roadW(0)*.5,H*.46],[W/2+roadW(0)*.5,H*.46],[W/2+roadW(1)*.5,H],[W/2-roadW(1)*.5,H]],'#252b32');
 // lane lines
 for(let z=.02;z<1;z+=.13){let y=roadY(z),w=roadW(z);x.strokeStyle='#f5d35a';x.lineWidth=Math.max(1,6*z);for(let l of [-.5,.5]){x.beginPath();x.moveTo(W/2+l*w*.33,y);x.lineTo(W/2+l*w*.33,y+Math.max(3,18*z));x.stroke()}}
 // roadside rails
 for(let z=.04;z<1;z+=.09){let y=roadY(z),w=roadW(z);x.fillStyle='#e5e0ce';x.fillRect(W/2-w*.58,y-2,Math.max(2,4*z),Math.max(2,10*z));x.fillRect(W/2+w*.58,y-2,Math.max(2,4*z),Math.max(2,10*z))}}
function drawChick(){let y=H*.72-jump*H*.22; if(duck)y+=H*.07;let s=Math.min(W,H)/430; x.save();x.translate(W/2,y);x.scale(s,s);x.shadowColor='#0008';x.shadowBlur=16;x.shadowOffsetY=10;
 x.fillStyle='#f6c928';x.beginPath();x.ellipse(0,5,34,38,0,0,Math.PI*2);x.fill();x.fillStyle='#ffd83e';x.beginPath();x.arc(0,-29,31,0,Math.PI*2);x.fill();
 x.fillStyle='#142b50';x.beginPath();x.moveTo(-31,-34);x.quadraticCurveTo(0,-58,31,-34);x.lineTo(25,-48);x.quadraticCurveTo(0,-70,-25,-48);x.closePath();x.fill();x.fillStyle='#e9c02b';x.fillRect(-27,-35,54,7);x.fillStyle='#111';x.beginPath();x.arc(-10,-29,4,0,7);x.arc(10,-29,4,0,7);x.fill();x.fillStyle='#e98c18';x.beginPath();x.moveTo(-7,-22);x.lineTo(8,-22);x.lineTo(0,-10);x.closePath();x.fill();x.strokeStyle='#c18a00';x.lineWidth=4;x.beginPath();x.moveTo(-14,39);x.lineTo(-18,53);x.moveTo(14,39);x.lineTo(18,53);x.stroke();x.restore()}
function drawObstacle(o){let z=o.z;if(z<.02)return;let y=roadY(z),w=roadW(z),cx=project(o.lane,z),scale=.18+.95*Math.pow(z,1.35);x.save();x.translate(cx,y);x.scale(scale,scale);if(o.type==='car'){x.fillStyle='#d64242';x.fillRect(-38,-28,76,32);x.fillStyle='#26384a';x.fillRect(-25,-46,50,20);x.fillStyle='#bde7ff';x.fillRect(-18,-42,16,12);x.fillRect(2,-42,16,12);x.fillStyle='#111';x.beginPath();x.arc(-25,8,10,0,7);x.arc(25,8,10,0,7);x.fill();x.fillStyle='#ffe56b';x.fillRect(-35,-18,7,7);x.fillRect(28,-18,7,7)}else{ // traffic light
 x.strokeStyle='#333';x.lineWidth=6;x.beginPath();x.moveTo(0,0);x.lineTo(0,-105);x.stroke();x.fillStyle='#222';x.fillRect(-18,-140,36,70);['#e44','#eb4','#4c5'].forEach((col,i)=>{x.fillStyle=col;x.beginPath();x.arc(0,-124+i*25,7,0,7);x.fill()})}
x.restore()}
function spawnItem(){let type=Math.random()<.58?'car':'light',lane=[-1,0,1][Math.floor(Math.random()*3)];items.push({type,lane,z:.03});}
function collide(o){if(o.z<.93&&o.z>.74&&o.lane===0){if(o.type==='car'&&jump<.42)return true;if(o.type==='light'&&!duck)return true}return false}
function update(dt){t+=dt;dist+=speed*dt*1.8;score=Math.floor(dist);speed=Math.min(13,7+dist/160);spawn-=dt;if(spawn<=0){spawn=rnd(.55,1.15)*Math.max(.55,8/speed);spawnItem()}items.forEach(o=>o.z+=dt*speed*.11);for(let i=items.length-1;i>=0;i--){let o=items[i];if(collide(o)){end();return}if(o.z>1.15)items.splice(i,1)}jump=Math.max(0,jump-dt*1.7)}
function draw(){drawWorld();items.sort((a,b)=>a.z-b.z).forEach(drawObstacle);drawChick();document.getElementById('score').textContent=score;}
function loop(now){if(!run)return;let dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}
function startGame(){document.getElementById('menu').classList.add('hide');document.getElementById('over').classList.add('hide');document.getElementById('controls').classList.remove('hide');score=dist=0;speed=7;jump=0;duck=false;items=[];spawn=.4;run=true;dead=false;const m=document.getElementById('music');m.volume=.55;m.currentTime=0;m.play().catch(()=>{});requestAnimationFrame(loop)}
function end(){run=false;dead=true;best=Math.max(best,score);localStorage.cypBest3d=best;document.getElementById('best').textContent=best;document.getElementById('finalScore').textContent=score;document.getElementById('finalDist').textContent=Math.floor(dist)+' м';document.getElementById('bar').style.width=Math.min(100,score/10)+'%';document.getElementById('controls').classList.add('hide');document.getElementById('over').classList.remove('hide');document.getElementById('music').pause()}
function doJump(){if(run&&!dead&&jump<=.05)jump=1}function setDuck(v){duck=v&&run&&!dead}
document.getElementById('start').onclick=startGame;document.getElementById('again').onclick=startGame;document.getElementById('jump').onpointerdown=e=>{e.preventDefault();doJump()};document.getElementById('duck').onpointerdown=e=>{e.preventDefault();setDuck(true)};['pointerup','pointercancel','pointerleave'].forEach(ev=>document.getElementById('duck').addEventListener(ev,()=>setDuck(false)));
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')doJump();if(e.code==='ArrowDown')setDuck(true)});addEventListener('keyup',e=>{if(e.code==='ArrowDown')setDuck(false)});
let sy=0;addEventListener('touchstart',e=>{sy=e.changedTouches[0].clientY},{passive:true});addEventListener('touchend',e=>{let dy=e.changedTouches[0].clientY-sy;if(Math.abs(dy)>35)(dy<0?doJump:()=>{setDuck(true);setTimeout(()=>setDuck(false),500)})()},{passive:true});draw();
</script></body></html>
