<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Цып-Цып — бег</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#8fd0ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}#game{position:relative;width:100%;height:100%;background:linear-gradient(#78c9ff 0 62%,#79bd58 62% 100%)}canvas{position:absolute;inset:0;width:100%;height:100%}.ui{position:absolute;inset:0;pointer-events:none}.hud{display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 14px 0;color:#fff;font-weight:900;text-shadow:0 2px 3px #345;font-size:18px}.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90%,430px);background:rgba(255,255,255,.96);border-radius:28px;padding:25px 20px;text-align:center;box-shadow:0 15px 45px #2448;pointer-events:auto}.panel h1{margin:0 0 8px;font-size:34px}.panel p{margin:8px 0 18px;color:#625747;font-size:17px;line-height:1.4}.btn{border:0;border-radius:20px;padding:15px 24px;background:#ffd84d;font-weight:900;font-size:21px;box-shadow:0 4px 0 #d8ae27;margin:5px}.small{font-size:16px;padding:12px 18px;background:#eef5ff;box-shadow:none}.controls{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}.ctrl{width:43vw;max-width:190px;height:68px;border:0;border-radius:24px;background:rgba(255,255,255,.88);font-size:28px;font-weight:900;box-shadow:0 6px 18px #2345}.hidden{display:none!important}.tip{font-size:14px;color:#857967;margin-top:12px}</style></head><body><div id="game"><canvas id="c"></canvas><div class="ui"><div class="hud"><span id="score">⭐ 0</span><span id="dist">0 м</span><span id="best">🏆 0</span></div><div id="panel" class="panel"><div style="font-size:72px">🐥</div><h1>Цып-Цып</h1><p>Перепрыгивай машины и пригибайся под светофорами. Скорость постепенно растёт!</p><button class="btn" id="music">🎵 Включить песню</button><br><button class="btn" id="start">▶ Играть</button><div class="tip">Прыжок: тап / свайп вверх · пригнуться: свайп вниз</div></div><div id="controls" class="controls hidden"><button class="ctrl" id="jump">⬆️ Прыжок</button><button class="ctrl" id="duck">⬇️ Пригнуться</button></div></div></div><audio id="song" src="cypa_song.mp3" preload="auto" loop playsinline></audio><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),panel=document.getElementById('panel'),controls=document.getElementById('controls'),song=document.getElementById('song');let W,H,dpr,playing=false,last=0,t=0,speed=5,score=0,dist=0,best=+localStorage.cypaBest||0,duck=false,jumpY=0,jumpV=0,obstacles=[],spawn=0,roadX=0;
const scoreEl=document.getElementById('score'),distEl=document.getElementById('dist'),bestEl=document.getElementById('best');bestEl.textContent='🏆 '+best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function speak(s){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ru-RU';u.rate=.86;u.pitch=1.22;speechSynthesis.speak(u)}
document.getElementById('music').onclick=async()=>{try{await song.play();document.getElementById('music').textContent='🔇 Песня играет'}catch(e){document.getElementById('music').textContent='🎵 Нажми ещё раз'}};
document.getElementById('start').onclick=()=>{startGame()};
function startGame(){panel.classList.add('hidden');controls.classList.remove('hidden');playing=true;last=performance.now();t=0;speed=5;score=0;dist=0;obstacles=[];spawn=0;jumpY=0;jumpV=0;duck=false;speak('Поехали! Цыпа, вперёд!');requestAnimationFrame(loop)}
function jump(){if(!playing)return;if(jumpY===0&&!duck){jumpV=-14}}
function setDuck(v){if(playing&&jumpY===0)duck=v}
document.getElementById('jump').onpointerdown=jump;document.getElementById('duck').onpointerdown=()=>setDuck(true);document.getElementById('duck').onpointerup=()=>setDuck(false);document.getElementById('duck').onpointercancel=()=>setDuck(false);
let sy=0;addEventListener('touchstart',e=>{if(e.touches.length)sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{if(!playing)return;let dy=e.changedTouches[0].clientY-sy;if(dy<-30)jump();else if(dy>30){setDuck(true);setTimeout(()=>setDuck(false),500)}else jump()},{passive:true});
function addObstacle(){let type=Math.random()<.55?'car':'light';obstacles.push({x:W+80,type,w:type==='car'?78:45,h:type==='car'?46:110,passed:false})}
function loop(now){if(!playing)return;let dt=Math.min((now-last)/16.67,2);last=now;t+=dt;speed=Math.min(9.2,5+t/650);dist+=speed*.08*dt;score=Math.floor(dist);scoreEl.textContent='⭐ '+score;distEl.textContent=Math.floor(dist)+' м';spawn-=dt;if(spawn<=0){addObstacle();spawn=75+Math.random()*55-Math.min(30,t/500)}update(dt);draw();requestAnimationFrame(loop)}
function update(dt){if(jumpY<0||jumpV<0){jumpY+=jumpV*dt;jumpV+=.72*dt;if(jumpY>0){jumpY=0;jumpV=0}}for(const o of obstacles){o.x-=speed*dt;if(!o.passed&&o.x+o.w<72){o.passed=true;score+=2}let px=58,py=H-150+jumpY;let hit;if(o.type==='car'){hit=px+52>o.x&&px<o.x+o.w&&py+48>H-132-o.h&&py+8<H-132}else{hit=px+52>o.x&&px<o.x+o.w&&py+12<H-210&&py+42>H-210}if(hit&&!duck){gameOver();return}}obstacles=obstacles.filter(o=>o.x>-150)}
function draw(){ctx.clearRect(0,0,W,H);let ground=H-130;ctx.fillStyle='#79bd58';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#50545a';ctx.fillRect(0,ground-20,W,100);ctx.strokeStyle='#d9d9b0';ctx.lineWidth=6;for(let x=-((t*speed*2)%90);x<W;x+=90){ctx.beginPath();ctx.moveTo(x,ground+28);ctx.lineTo(x+45,ground+28);ctx.stroke()}ctx.fillStyle='#68aee8';ctx.fillRect(0,ground-115,W,8);drawChick(58,ground-80+jumpY,duck);for(const o of obstacles){if(o.type==='car')drawCar(o.x,ground);else drawLight(o.x,ground)}}
function drawChick(x,y,isDuck){ctx.save();ctx.translate(x,y);let sy=isDuck?.65:1;ctx.scale(1,sy);ctx.fillStyle='#ffd84d';ctx.beginPath();ctx.ellipse(30,32,34,30,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe56c';ctx.beginPath();ctx.arc(52,8,25,0,Math.PI*2);ctx.fill();ctx.fillStyle='#263b63';ctx.beginPath();ctx.ellipse(52,-13,28,10,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(27,-13,50,8);ctx.fillStyle='#222';ctx.beginPath();ctx.arc(59,5,3,0,7);ctx.fill();ctx.fillStyle='#f19a38';ctx.beginPath();ctx.moveTo(75,11);ctx.lineTo(91,17);ctx.lineTo(75,23);ctx.fill();ctx.strokeStyle='#e89b31';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(22,58);ctx.lineTo(18,69);ctx.moveTo(45,58);ctx.lineTo(48,69);ctx.stroke();ctx.restore()}
function drawCar(x,g){ctx.fillStyle='#e95754';ctx.fillRect(x,g-75,78,45);ctx.fillStyle='#9ed7f4';ctx.fillRect(x+45,g-67,25,20);ctx.fillStyle='#333';ctx.beginPath();ctx.arc(x+17,g-27,11,0,7);ctx.arc(x+61,g-27,11,0,7);ctx.fill();ctx.fillStyle='#ffd84d';ctx.fillRect(x+5,g-65,15,8)}
function drawLight(x,g){ctx.strokeStyle='#45484d';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x+20,g-5);ctx.lineTo(x+20,g-150);ctx.stroke();ctx.fillStyle='#41464d';ctx.fillRect(x,g-160,42,78);for(let i=0;i<3;i++){ctx.fillStyle=['#ef6b68','#ffd84d','#72c78a'][i];ctx.beginPath();ctx.arc(x+21,g-143+i*25,8,0,7);ctx.fill()}}
function gameOver(){playing=false;controls.classList.add('hidden');if(score>best){best=score;localStorage.cypaBest=best}bestEl.textContent='🏆 '+best;panel.innerHTML=`<div style="font-size:70px">🐥💥</div><h1>Ой! Цыпа остановился</h1><p>Результат: <b>${score} м</b><br>Лучший результат: <b>${best} м</b></p><button class="btn" onclick="startGame()">🔄 Ещё раз</button>`;panel.classList.remove('hidden');speak('Ой! Цыпа остановился. Попробуем ещё раз?')}
function render(){draw();requestAnimationFrame(render)}render();
</script></body></html>
